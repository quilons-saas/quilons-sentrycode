name: SentryCode
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sentrycode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: ${{ vars.QUILONS_NPM_REGISTRY || 'https://registry.npmjs.org' }}
      - name: Install SentryCode
        run: npm install --no-save @quilons/sentrycode@0.1.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.QUILONS_NPM_TOKEN }}
      - name: Run SentryCode
        run: npx --no-install sentrycode check . --ci --format sarif --output .sentrycode/out/sentrycode.sarif
